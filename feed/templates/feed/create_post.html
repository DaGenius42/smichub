{% extends "base-after-login.html" %}

{% block title %}Create Post · SMIC HUB{% endblock %}

{% block content %}
<section class="form-card narrow-card">
    <p class="eyebrow">A place to share your thoughts</p>
    <h1>Write your post here...</h1>

    <form class="stacked-form" method="post" enctype="multipart/form-data">
    <!-- multipart for text and other file uploads-->
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button class="button" type="submit">
                Share post
            </button>
            <a class="text-action" href="{% url 'feed:home' %}">
                Cancel
            </a>
        </div>
    </form>
</section>
{% endblock %}
