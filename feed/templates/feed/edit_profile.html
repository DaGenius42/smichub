{% extends "base-after-login.html" %}

{% block title %}Edit Profile · SMIC HUB{% endblock %}

{% block content %}
<section class="form-card narrow-card">
    <p class="eyebrow">Your profile</p>
    <h1>Edit profile</h1>

    <form class="stacked-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button class="button" type="submit">Save changes</button>
            <a class="text-action" href="{% url 'feed:profile' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
